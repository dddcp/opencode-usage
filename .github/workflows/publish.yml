name: publish

# CI on every push to main; publish to npm only on version tags (v*) or a
# manual dispatch. The published version comes from package.json — bump it
# with `npm version patch|minor|major` before tagging.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) — tokenless, no 2FA needed

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Check version is not already published
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "opencode-coding-quota@$CURRENT" version >/dev/null 2>&1; then
            echo "::error::version $CURRENT is already on npm — bump package.json before publishing"
            exit 1
          fi
          echo "publishing $CURRENT"
      # Tokenless publish via npm trusted publishing (OIDC). Requires the
      # trusted publisher to be configured on the npm package page:
      # repository dddcp/opencode-usage, workflow publish.yml.
      - run: npm publish --provenance --access public
      - name: Verify on registry
        run: npm view opencode-coding-quota version
